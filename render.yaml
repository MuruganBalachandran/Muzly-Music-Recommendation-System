services:
  - type: web
    name: music-recommendation-api
    env: python
    plan: free
    buildCommand: pip install -r model/requirements.txt
    startCommand: gunicorn -w 1 -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT --chdir model wsgi:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: MONGO_URI
        sync: false
      - key: OPENWEATHER_API_KEY
        sync: false
